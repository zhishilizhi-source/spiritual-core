[project]
name = "spiritual-core"
version = "0.1.0"
description = "Spiritual Core — the memory layer of 双生"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.28",   # MIT
    "tzdata",      # Apache-2.0; Windows has no system zoneinfo
    "pillow",      # MIT-CMU
    "python-multipart",  # Apache-2.0; form uploads
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
spiritual-core = "spiritual_core.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["spiritual_core"]

[tool.setuptools.package-data]
spiritual_core = ["static/*"]
