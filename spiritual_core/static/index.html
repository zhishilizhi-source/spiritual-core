  });

  function say(el, text, ok) { el.textContent = text; el.className = "msg " + (ok ? "ok" : "bad"); }

  async function send(form, msgEl, request, reset) {
    const btn = form.querySelector(".go");
    btn.disabled = true; say(msgEl, "存着……", true);
    try {
      const res = await request();
      const data = await res.json().catch(() => ({ ok: false, error: "服务器没回话" }));
      if (!data.ok) throw new Error(data.error || "没存上");
      say(msgEl, "存好了 · " + data.item.event_date, true);
      reset(); loadRecent();
    } catch (e) {
      say(msgEl, e.message || "没存上", false);
    } finally { btn.disabled = false; }
  }

  // One request per photo: each keeps its own capture date when no date is given,
  // and one bad file doesn't sink the rest.
  $("#photo").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const files = [...fileInput.files];
    if (!files.length) { say($("#photoMsg"), "先选照片或视频", false); return; }
    const btn = $("#photo .go"), msg = $("#photoMsg");
    btn.disabled = true;
    const failed = [];
    const batch = files.length > 1
      ? (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10))
      : "";
    for (let i = 0; i < files.length; i++) {
      say(msg, files.length > 1 ? `存着 ${i + 1}/${files.length}……` : "存着……", true);
      const fd = new FormData();
      fd.append("file", files[i]);
      fd.append("caption", $("#caption").value);
      fd.append("event_date", $("#photoDate").value);
      fd.append("batch", batch);
      try {
        const data = await (await fetch("api/image", { method: "POST", body: fd })).json();
        if (!data.ok) throw new Error(data.error);
      } catch (e) { failed.push(`${files[i].name}：${e.message || "没存上"}`); }
    }
    btn.disabled = false;
    const ok = files.length - failed.length;
    if (failed.length) say(msg, `存好 ${ok} 张，${failed.length} 张没存上：${failed.join("；")}`, false);
    else say(msg, files.length > 1 ? `${ok} 张都存好了` : "存好了", true);
    if (!failed.length) { $("#photo").reset(); fileInput.dispatchEvent(new Event("change")); }
    loadRecent();
  });

  $("#words").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const words = $("#w").value;
    if (!words.trim()) { say($("#wordsMsg"), "原话是空的", false); return; }
    send($("#words"), $("#wordsMsg"),
      () => fetch("api/keep", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ words, why: $("#why").value, event_date: $("#wordsDate").value }) }),
      () => $("#words").reset());
  });

  // --- 今天 ---
  const md = (s) => { const [, m, d] = s.split("-"); return `${+m}月${+d}日`; };
  // His messages: he speaks first, she answers whenever. One row holding all of them.
  function msgItemHtml(m) {
    return `<div class="note-item" data-id="${esc(m.id)}">
      <div class="body">${esc(m.body)}</div>
      <div class="meta">${when(m.created_at)}</div>
      ${m.reply ? `<div class="her-reply"><span>你回</span>${esc(m.reply)}</div>`
                : `<button type="button" class="reply-open">回复</button>
      <div class="reply-box" hidden><textarea rows="3" placeholder="回他一句，写什么都行"></textarea>
        <div class="edit-actions"><button type="button" class="r-cancel">算了</button><button type="button" class="r-send">发给他</button></div>
        <div class="msg"></div></div>`}
    </div>`;
  }
  function msgsHtml(list) {
    const unseen = list.filter((m) => !m.seen_at).length;
    return `<details class="rec msgs"><summary><span class="kind">留言</span>
      <span class="t">${esc(list[0].title)}</span>${unseen ? `<span class="layer new">${unseen} 新</span>` : ""}<span class="aside">${md(list[0].event_date)}</span></summary>
      <div class="full">${list.map(msgItemHtml).join("")}<div class="hint">你回过的，第二天收进便签。</div>
      <div class="close-wrap"><button type="button" class="close">收起</button></div></div></details>`;
  }
  $("#today").addEventListener("click", async (ev) => {
    const item = ev.target.closest(".note-item"); if (!item) return;
    const box = item.querySelector(".reply-box");
    if (ev.target.closest(".reply-open")) {
      ev.target.hidden = true; box.hidden = false; box.querySelector("textarea").focus(); return;
    }
    if (ev.target.closest(".r-cancel")) { box.hidden = true; item.querySelector(".reply-open").hidden = false; return; }
    const send = ev.target.closest(".r-send"); if (!send) return;
    const text = box.querySelector("textarea").value.trim();
    if (!text) return;
    send.disabled = true; box.querySelector(".msg").textContent = "发着……";
    try {
      const data = await (await fetch(`api/message/${item.dataset.id}/reply`, { method: "POST",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) })).json();
      if (!data.ok) throw new Error(data.error);
      item.outerHTML = msgItemHtml(data.item);
    } catch (e) { box.querySelector(".msg").textContent = e.message || "没发出去"; send.disabled = false; }
  });

  // Compact on purpose: one line each, opened on tap, so the forms below stay on the first screen.
  function renderToday(v) {
    // the sealed 心里话 sits at the end of the count line instead of taking its own
    const sealed = v.locked ? `<span class="sealed-note">锁着 ${v.locked} 条心里话</span>` : "";
    const count = v.days.length || sealed ? `<div class="count">${v.days.map((a) =>
      `<span>${esc(a.name)}${a.ahead ? "还有" : ""} <b>${a.days}</b> 天</span>`).join("")}${sealed}</div>` : "";
    const rows = [];
    if (v.diary) rows.push(recHtml(v.diary, "日记", md(v.diary.event_date)));
    // The board stays even when there's nothing on it.
    rows.unshift(v.messages.length ? msgsHtml(v.messages)
      : `<div class="rec"><div class="still"><span class="kind">留言</span><span class="t" style="color:var(--muted)">空着</span></div></div>`);
    if (v.month_ago) rows.push(recHtml(v.month_ago, "一月前", md(v.month_ago_date)));
    $("#today").innerHTML = count + rows.join("");
  }
  $("#today").addEventListener("click", shelfClick);
  $("#today").addEventListener("toggle", (ev) => {
    const d = ev.target;
    if (!d.open || d.dataset.seen) return;
    d.dataset.seen = "1";
    if (d.classList.contains("msgs")) {
      const ids = [...d.querySelectorAll(".note-item")].map((x) => x.dataset.id);
      fetch("api/message/seen", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ids }) }).catch(() => {});
      d.querySelector(".layer.new")?.remove();
      return;
    }
    const id = d.querySelector(".rate")?.dataset.id;
    if (id) fetch("api/seen/" + id, { method: "POST" }).catch(() => {});
  }, true);
  async function loadToday() {
    try { renderToday(await (await fetch("api/today")).json()); } catch {}
  }
  loadToday();

  // Size the forms to reach the bottom of the screen from wherever they start.
  function fitForms() {
    const f = [...document.querySelectorAll("form.card")].find((x) => !x.hidden);
    if (!f) return;
    const pad = parseFloat(getComputedStyle(document.body).paddingBottom) || 24;
    const h = Math.round(innerHeight - (f.getBoundingClientRect().top + scrollY) - pad);
    document.documentElement.style.setProperty("--form-h", Math.max(h, writeHeight()) + "px");
  }
  // 写一条 at its own natural size is the size she picked for all three.
  let writeH = 0;
  function writeHeight() {
    if (writeH) return writeH;
    const w = $("#write"), was = w.hidden;
    w.hidden = false; w.style.cssText = "position:absolute;visibility:hidden;min-height:0;left:16px;right:16px";
    writeH = Math.ceil(w.getBoundingClientRect().height);
    w.style.cssText = ""; w.hidden = was;
    return writeH;
  }
  addEventListener("resize", fitForms);
  new ResizeObserver(fitForms).observe($("#us"));
  document.querySelectorAll(".save-tabs button").forEach((b) => b.addEventListener("click", fitForms));

  async function loadRecent() {
    try {
      const { items } = await (await fetch("api/recent")).json();
      // One titled row each, like 翻看: the title says enough, the words wait inside.
      $("#recent").innerHTML = items.length ? items.map((it) => recHtml(it, "", md(it.event_date))).join("")
        : `<div class="meta">还什么都没有。</div>`;
    } catch { $("#recent").innerHTML = `<div class="meta">最近的没拉下来。</div>`; }
  }
  loadRecent();

  // --- 我们俩 ---
  const hm = (iso) => iso ? iso.slice(11, 16).replace(/^0/, "") : "";
  const dur = (m) => m >= 60 ? `${Math.floor(m / 60)}时${String(m % 60).padStart(2, "0")}分` : `${m}分`;
  function bandHtml(segs) {
    if (!segs.length) return "";
    const t = (x) => Date.parse(x);
    const lo = Math.min(...segs.map((g) => t(g.s))), hi = Math.max(...segs.map((g) => t(g.e)));
    const span = Math.max(hi - lo, 1);
    return `<div class="band" role="img" aria-label="昨晚的睡眠">${segs.map((g) =>
      `<i class="${esc(g.stage)}" style="left:${((t(g.s) - lo) / span * 100).toFixed(2)}%;width:${((t(g.e) - t(g.s)) / span * 100).toFixed(2)}%"></i>`).join("")}</div>`;
  }
  // No numbers on the heart: a thin line that is flat when she's calm and rises where she didn't.
  function pulseHtml(pts) {
    if (pts.length < 3) return "";
    const xs = pts.map((p) => Date.parse(p.t)), ys = pts.map((p) => p.bpm);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys, y0 + 20);
    const d = pts.map((p, i) => `${i ? "L" : "M"}${((xs[i] - x0) / Math.max(x1 - x0, 1) * 100).toFixed(1)},${(24 - (p.bpm - y0) / (y1 - y0) * 22).toFixed(1)}`).join("");
    return `<svg class="pulse" viewBox="0 0 100 26" preserveAspectRatio="none" aria-label="今天的心跳"><path d="${d}" vector-effect="non-scaling-stroke"/></svg>`;
  }
  const heartHtml = (pts) => pts.length >= 3
    ? `<div class="small" style="margin-top:8px">今天的心跳</div>${pulseHtml(pts)}`
    : `<div class="small" style="margin-top:8px">心跳还没接上</div>`;
  function renderUs(v) {
    const n = v.her.night;
    const her = n
      ? `<div class="who">她<span>昨晚</span></div>${bandHtml(n.segments)}
         <div class="big">${hm(n.fell)} → ${hm(n.woke)}</div>
         <div class="small">睡了 ${dur(n.asleep)}${n.wakes ? ` · 醒过 ${n.wakes} 次` : ""}</div>
         <div class="small">深睡 ${dur(n.deep)} · 做梦 ${dur(n.rem)}</div>${heartHtml(v.her.heart)}`
      : `<div class="who">她<span>昨晚</span></div><div class="none">昨晚的觉还没推过来。</div>${heartHtml(v.her.heart)}`;
    const m = v.me, last = m.wakes[m.wakes.length - 1];
    const myMood = m.now && m.now.mood && MOOD[m.now.mood] ? m.now.mood : "";
    const mc = myMood ? `--m:${moodDot(myMood)}` : "";
    const minds = (m.minds || []).map((d) => `<span>${esc(d.text)}</span>`).join("");
    const me = `<div class="who">陆能<span>今天</span></div>
      <div class="me-top"><span class="orb${myMood ? "" : " blank"}" style="${mc}">${myMood ? esc(myMood) : "·"}</span>
        <div class="quote">${m.now ? esc(m.now.text) : "还没写此刻。"}</div></div>
      ${minds ? `<div class="chips-mind" style="${mc}" aria-label="我惦记着">${minds}</div>` : ""}
      <div class="small wakes">${m.wakes.length ? `醒了 ${m.wakes.length} 次 · 最近 ${hm(last)}` : "今天还没醒"}</div>`;
    $("#us").innerHTML = `<div class="side" role="button" tabindex="0" data-side="her" aria-expanded="false">${her}</div>`
      + `<div class="side" role="button" tabindex="0" data-side="me" aria-expanded="false">${me}</div>`
      + `<div class="us-detail" id="usDetail" hidden></div>`;
    usData = v;
    renderLine(v.line);
    renderWeek(v.week);
    if (openSide) openDetail(openSide);
  }
  let usData = null, openSide = null;
  const WD = "日一二三四五六";
  const mdOf = (d) => `${+d.slice(5, 7)}/${+d.slice(8, 10)}`;
  // Every night drawn on the same clock, 20:00 to 12:00, so a late night looks late.
  function nightBand(n) {
    if (!n.segments) return `<div class="band"></div>`;
    const lo = Date.parse(n.day + "T12:00:00+08:00") - 16 * 3600e3, span = 16 * 3600e3;
    const pos = (x) => Math.min(100, Math.max(0, (Date.parse(x) - lo) / span * 100));
    return `<div class="band" role="img" aria-label="${esc(mdOf(n.day))} 的睡眠">${n.segments.map((g) =>
      `<i class="${esc(g.stage)}" style="left:${pos(g.s).toFixed(2)}%;width:${(pos(g.e) - pos(g.s)).toFixed(2)}%"></i>`).join("")}</div>`;
  }
  function openDetail(side) {
    const box = $("#usDetail");
    document.querySelectorAll(".side").forEach((b) => b.setAttribute("aria-expanded", String(b.dataset.side === side)));
    if (!side || !usData) { box.hidden = true; return; }
    if (side === "her") {
      const rows = usData.her.nights.map((n) => {
        const d = new Date(n.day + "T12:00:00+08:00");
        return `<div class="night${n.segments ? "" : " none"}"><span class="d">${mdOf(n.day)} 周${WD[d.getDay()]}</span>${nightBand(n)}
          ${n.segments ? `<span class="t">${hm(n.fell)} → ${hm(n.woke)} · ${dur(n.asleep)}</span>` : ""}</div>`;
      }).join("");
      box.innerHTML = `<h3>最近七夜</h3><div class="nights">${rows}</div><div class="axis"><span>20:00</span><span>0:00</span><span>4:00</span><span>8:00</span><span>12:00</span></div>`
        + (usData.her.heart.length >= 3 ? `<h3 style="margin-top:14px">今天的心跳</h3>${pulseHtml(usData.her.heart)}` : "");
    } else {
      const days = (usData.me.days || []).map((d) => {
        const dd = new Date(d.day + "T12:00:00+08:00");
        const mood = d.mood && MOOD[d.mood] ? `<span class="mood-w"><i style="background:${moodDot(d.mood)}"></i>${esc(d.mood)}</span>` : "";
        const said = d.nows.slice().reverse().slice(0, 3).map((x) =>
          `<span class="said"><span>${hm(x.at)}</span>${esc(x.text)}</span>`).join("");
        const held = d.minds.filter((x) => !x.let_go), gone = d.minds.filter((x) => x.let_go);
        const minds = (held.length ? `<span class="minds">惦记：${held.map((x) => esc(x.text)).join("、")}</span>` : "")
          + (gone.length ? `<span class="minds gone">放下了：${gone.map((x) => esc(x.text)).join("、")}</span>` : "");
        const body = mood + said + minds || `<span class="minds">那天没留下我自己的话${d.wakes ? "" : ""}</span>`;
        return `<div class="myday"><span class="d">${mdOf(d.day)} 周${WD[dd.getDay()]}</span>${body}</div>`;
      }).join("");
      box.innerHTML = `<h3>我这七天</h3><div class="mydays">${days}</div>`
        + `<div class="week-note">心情和此刻是我自己挑、自己写的；9/28 才开始记，往前是空的。</div>`;
    }
    box.hidden = false;
  }
  $("#us").addEventListener("click", (ev) => {
    const b = ev.target.closest(".side"); if (!b) return;
    openSide = openSide === b.dataset.side ? null : b.dataset.side;
    openDetail(openSide);
  });
  $("#us").addEventListener("keydown", (ev) => {
    if ((ev.key === "Enter" || ev.key === " ") && ev.target.closest(".side")) { ev.preventDefault(); ev.target.click(); }
  });
  function renderLine(l) {
    const box = $("#lineCard");
    if (!l) { box.hidden = true; return; }
    // folded: one line; when the first line is only who's speaking ("陆能：", "她："), show the next
    const lines = l.words.split(/\r?\n/).map((x) => x.trim()).filter(Boolean);
    const peek = lines.length > 1 && /^.{1,6}[：:]$/.test(lines[0]) ? lines[1] : (lines[0] || "");
    box.innerHTML = `<div class="card-h">${l.picked ? "陆能今天挑的一句" : "今天翻到的一句"}</div><div class="peek">${esc(peek)}</div><div class="words">${esc(l.words.trim())}</div>`
      + `<div class="meta">${esc(md(l.event_date))} · ${esc(l.who)}${l.picked
          ? ` · 陆能今天挑的${l.why ? `：${esc(l.why)}` : ""}` : " · 今天抽到的"}</div>`;
    box.setAttribute("role", "button"); box.tabIndex = 0;
    box.setAttribute("aria-expanded", String(box.classList.contains("open")));
    box.hidden = false;
  }
  $("#lineCard").addEventListener("click", () => {
    const b = $("#lineCard"); b.classList.toggle("open");
    b.setAttribute("aria-expanded", String(b.classList.contains("open")));
  });
  function renderWeek(week) {
    const box = $("#weekCard");
    if (!week || !week.length) { box.hidden = true; return; }
    const cells = week.map((w, i) => {
      const d = new Date(w.day + "T12:00:00+08:00");
      const color = w.mood && MOOD[w.mood] ? `background:${moodDot(w.mood)}` : "";
      const sleep = w.asleep ? `<b style="width:${Math.min(100, w.asleep / 540 * 100).toFixed(0)}%"></b>` : "";
      const label = `${mdOf(w.day)}${w.mood ? "，心情" + w.mood : ""}${w.asleep ? "，睡了" + dur(w.asleep) : ""}${w.diary ? "，写了日记" : ""}`;
      const mine = w.my_mood && MOOD[w.my_mood] ? `background:${moodDot(w.my_mood)}` : "";
      return `<div class="wd${i === week.length - 1 ? " today" : ""}" aria-label="${esc(label + (w.my_mood ? "；陆能：" + w.my_mood : ""))}">
        <span class="n">${i === week.length - 1 ? "今天" : "周" + WD[d.getDay()]}</span>
        <span class="mood-cell" style="${color}">${w.diary ? "<i></i>" : ""}</span>
        <span class="sleep">${sleep}</span>
        <span class="mine" style="${mine}"></span></div>`;
    }).join("");
    box.innerHTML = `<div class="card-h">这一周</div><div class="week">${cells}</div>`
      + `<div class="week-note">大格子是你那天的心情，小点是写了日记，那一道是那晚睡了多久（满格九小时）；最下面一排是我的心情。</div>`;
    box.hidden = false;
  }
  async function loadUs() {
    try { renderUs(await (await fetch("api/us")).json()); } catch {}
  }
  loadUs();
  // a page can be opened by name from the address (…/#save), else the last one she looked at
  let startPage = location.hash.slice(1);
  if (!startPage) try { startPage = localStorage.getItem("sc-page") || "today"; } catch { startPage = "today"; }
  showPage(startPage);
</script>
</body>
</html>
