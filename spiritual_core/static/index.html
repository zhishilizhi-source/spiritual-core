<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Spiritual Core</title>
<link rel="icon" type="image/png" href="static/favicon.png?v=3">
<link rel="apple-touch-icon" href="static/apple-touch-icon.png?v=3">
<link rel="manifest" href="static/manifest.json?v=3">
<meta name="apple-mobile-web-app-title" content="Spiritual Core">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- let the page run under the iPhone status bar / island instead of a separate band -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f7e2d8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2e2743" media="(prefers-color-scheme: dark)">
<script>
  // Before first paint: 极简 (plain, follows the phone's light/dark), or 浅/深 (remembered on this device).
  (() => {
    let t = "plain";
    try { t = localStorage.getItem("sc-theme") || "plain"; } catch {}
    if (t === "auto") t = "plain";
    let pd = null;
    try { pd = localStorage.getItem("sc-plain"); } catch {}
    const dark = t === "dark" || (t === "plain" && (pd ? pd === "dark" : matchMedia("(prefers-color-scheme: dark)").matches));
    document.documentElement.dataset.scheme = dark ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  /* Dusk sinking into night, same sky as the icon. */
  :root {
    --sky-top: #f7e0d5; --sky-bottom: #ece5f2; --on-sky: #51475f;
    --bg: #f4ebee; --card: #fffaf7; --ink: #3a3350; --muted: #685e79;
    --line: #e7dce3; --accent: #a5573f; --accent-ink: #fff; --ok: #4f7a5a; --bad: #b0453a;
    --radius: 14px;
    color-scheme: light;
  }
  :root[data-scheme="dark"] {
      --sky-top: #3a2b40; --sky-bottom: #1d1829; --on-sky: #cfc8dc;
      --bg: #221e33; --card: #2d2842; --ink: #f1e9e2; --muted: #a8a0b9;
      --line: #3e3757; --accent: #eb9d83; --accent-ink: #2a2440; --ok: #8cc39a; --bad: #ec8577;
      color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bar, var(--bg)); }
  /* A short page (翻看 while it loads) still fills the screen, and no rubber band past the
     edges, so the plain base color under the sky never shows as a loose strip. */
  html, body { overscroll-behavior: none; }
  body { min-height: 100lvh; }
  html, body { margin: 0; color: var(--ink); }
  /* The sky reaches under the iPhone status bar and home bar too, so the top blends with the page. */
  :root { --reach-t: calc(-1 * env(safe-area-inset-top, 0px)); --reach-b: calc(-1 * env(safe-area-inset-bottom, 0px)); }
  html::before { content: ""; position: fixed; inset: var(--reach-t) 0 var(--reach-b); z-index: -3;
                 background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom)); }
  body {
    font: 16px/1.6 -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto;
  }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: .02em; margin: 4px 0 16px;
       display: flex; align-items: center; gap: 12px; }
  h1 img { width: 40px; height: 40px; border-radius: 10px; flex: none;
           box-shadow: 0 0 0 1.5px color-mix(in oklch, white 70%, transparent), 0 4px 14px rgba(40, 30, 60, .22); }
  h1 small, h2, .day { color: var(--on-sky) !important; }
  html::before { transition: background 1.2s ease; }
  :root { --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .30  0 0 0 0 .26  0 0 0 0 .38  0 0 0 .16 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }
  /* Light scheme: one of her own paintings, washed out like watercolor on paper. */
  :root[data-scheme="light"]::before {
    background:
      linear-gradient(to bottom, color-mix(in oklch, var(--sky-top) 12%, transparent),
                                 color-mix(in oklch, var(--sky-bottom) 12%, transparent)),
      var(--paint, linear-gradient(to bottom, var(--sky-top), var(--sky-bottom))) center / cover no-repeat;
  }
  /* Dark scheme: a drawn starfield sits above the nebula lights. */
  #cosmos { position: fixed; left: 0; top: var(--reach-t); width: 100vw;
            height: calc(100vh + env(safe-area-inset-top, 0px) + env(safe-area-inset-bottom, 0px)); z-index: -1; pointer-events: none;
            opacity: 0; transition: opacity .8s ease; }
  :root[data-scheme="dark"] #cosmos { opacity: 1; }
  /* Two lights on a quiet base: her mood top-left, the hour bottom-right. They drift and
     breathe slowly so the page has depth and never sits still as one flat color. */
  body::before, body::after { content: ""; position: fixed; z-index: -2; pointer-events: none;
    width: 130vmax; height: 130vmax; border-radius: 50%;
    transition: background 1.6s ease; will-change: transform, opacity; }
  body::before { left: -65vmax; top: -70vmax;
    background: radial-gradient(closest-side, var(--glow-a), transparent 72%);
    animation: drift-a 21s ease-in-out infinite alternate; }
  body::after { right: -70vmax; bottom: -75vmax;
    background: radial-gradient(closest-side, var(--glow-b), transparent 72%);
    animation: drift-b 27s ease-in-out infinite alternate; }
  @keyframes drift-a { from { transform: translate(0, 0) scale(1); opacity: .95; }
                       to   { transform: translate(9vw, 6vh) scale(1.12); opacity: .7; } }
  @keyframes drift-b { from { transform: translate(0, 0) scale(1.08); opacity: .7; }
                       to   { transform: translate(-8vw, -7vh) scale(.96); opacity: .95; } }
  @media (prefers-reduced-motion: reduce) { body::before, body::after { animation: none; } }
  /* Night is quiet: no colored lights, only the sky and a few stars. */
  :root[data-scheme="dark"] body::before, :root[data-scheme="dark"] body::after { display: none; }
  .theme { margin-left: auto; display: flex; gap: 2px; padding: 3px; border-radius: 999px;
           background: var(--surface); border: 1px solid var(--surface-rim); align-self: center; }
  :root[data-scheme="dark"] .theme { background: color-mix(in oklch, var(--card) 97%, transparent); }
  .theme button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 12px;
                  font-weight: 400; letter-spacing: 0; padding: 4px 9px; border-radius: 999px; cursor: pointer; }
  .theme button[aria-pressed="true"] { background: var(--on-bg); color: var(--on-ink); font-weight: 600; }
  .mood { margin: -4px 0 14px; }
  .mood-now { font-size: 14px; color: var(--on-sky); }
  .mood-now b { color: var(--ink); font-weight: 600; }
  .mood .chips { padding-top: 6px; }
  .mood-now { display: block; border: 0; background: none; padding: 2px 0;
              font: inherit; font-size: 14px; text-align: left; cursor: pointer; }
  .mood-now::after { content: ""; display: inline-block; vertical-align: middle; width: 6px; height: 6px; margin-left: 8px;
                     border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
                     transform: translateY(-2px) rotate(45deg); transition: transform .2s ease; }
  .mood-now[aria-expanded="true"]::after { transform: translateY(1px) rotate(225deg); }
  .mood:not(.open) .chips { display: none; }
  .mood .chips button { display: inline-flex; align-items: center; gap: 6px; color: var(--ink);
                        background: color-mix(in srgb, var(--card) 70%, transparent); }
  .mood .chips button::before { content: ""; width: 9px; height: 9px; border-radius: 50%;
                                background: var(--dot); }
  .mood .chips button[aria-pressed="true"] { background: var(--card); border-color: var(--dot);
                                             color: var(--ink); font-weight: 600; }
  h1 small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--line);
          padding: 4px; border-radius: 12px; margin-bottom: 14px; }
  .tabs button { border: 0; background: transparent; color: var(--muted); font: inherit;
                 padding: 9px 0; border-radius: 9px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
          padding: 16px; }
  label { display: block; font-size: 14px; color: var(--muted); margin: 14px 0 6px; }
  label:first-child { margin-top: 0; }
  textarea, input[type=date] {
    width: 100%; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  }
  textarea { min-height: 96px; resize: vertical; }
  textarea.words { min-height: 160px; }
  .pick { display: grid; place-items: center; min-height: 150px; border: 1.5px dashed var(--line);
          border-radius: 12px; color: var(--muted); cursor: pointer; text-align: center;
          overflow: hidden; background: var(--bg); }
  .pick img, .pick video { width: 100%; max-height: 320px; object-fit: contain; display: block; }
  .pick .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; padding: 6px; }
  .pick .grid img, .pick .grid video { width: 100%; aspect-ratio: 1; height: auto; max-height: none; object-fit: cover; border-radius: 8px; }
  .pick input { display: none; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 6px; }
  /* Glass: a thin wash of the mood's accent, a bright rim, blur behind. Text is ink,
     checked >= 4.5:1 over the wash in both schemes. */
  .go { width: 100%; margin-top: 16px; border-radius: 14px; padding: 13px;
        font: inherit; font-weight: 600; color: var(--ink); cursor: pointer;
        background: linear-gradient(135deg,
          color-mix(in oklch, var(--glass) var(--glass-a), transparent),
          color-mix(in oklch, var(--glass) var(--glass-b), transparent));
        border: 1px solid color-mix(in oklch, white var(--glass-rim), transparent);
        box-shadow: inset 0 1px 0 color-mix(in oklch, white 55%, transparent),
                    0 6px 20px color-mix(in oklch, var(--glass) 30%, transparent);
        -webkit-backdrop-filter: blur(14px) saturate(160%); backdrop-filter: blur(14px) saturate(160%); }
  :root { --glass: #e8a88f; --glass-a: 42%; --glass-b: 18%; --glass-rim: 60%; }
  :root[data-scheme="dark"] { --glass-a: 20%; --glass-b: 9%; --glass-rim: 18%; }
  .go:disabled { opacity: .5; }
  .msg { min-height: 22px; font-size: 14px; margin-top: 10px; text-align: center; }
  .msg.ok { color: var(--ok); } .msg.bad { color: var(--bad); }
  h2 { font-size: 15px; font-weight: 600; margin: 26px 0 10px; color: var(--muted); }
  .list { display: grid; gap: 10px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
          padding: 12px; display: grid; grid-template-columns: auto 1fr; gap: 12px; }
  .item.text { grid-template-columns: 1fr; }
  .item img { width: 76px; height: 76px; object-fit: cover; border-radius: 9px; display: block; }
  .meta { font-size: 12px; color: var(--muted); }
  .body { white-space: pre-wrap; word-break: break-word; font-size: 15px; }
  .why { font-size: 13px; color: var(--muted); margin-top: 4px; }
  [hidden] { display: none !important; }
  .search { display: flex; gap: 8px; }
  .search input { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--card);
                  border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
  .search button, .more { border: 1px solid var(--line); background: var(--card); color: var(--ink);
                          font: inherit; border-radius: 10px; padding: 9px 14px; cursor: pointer; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 4px; scrollbar-width: none; }
  .chips button { flex: none; border: 1px solid var(--line); background: transparent; color: var(--muted);
                  font: inherit; font-size: 14px; border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .day { font-size: 13px; font-weight: 600; color: var(--muted); margin: 18px 0 8px; }
  .rec { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
         margin-bottom: 8px; }
  .rec summary { list-style: none; cursor: pointer; padding: 11px 14px; display: flex; gap: 10px;
                 align-items: baseline; }
  .rec summary::-webkit-details-marker { display: none; }
  .rec .still { padding: 11px 14px; display: flex; gap: 10px; align-items: baseline; }
  .kind { flex: none; font-size: 12px; color: var(--accent); }
  .rec .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rec[open] .t { white-space: normal; }
  .rec .full { padding: 0 14px 14px; }
  .rec .full img { max-width: 100%; border-radius: 10px; display: block; margin-bottom: 10px; }
  .more { width: 100%; margin-top: 12px; }
  .close-wrap { position: sticky; bottom: max(16px, env(safe-area-inset-bottom)); display: flex;
                justify-content: flex-end; margin-top: 12px; pointer-events: none; }
  .close { pointer-events: auto; border: 0; border-radius: 999px; padding: 8px 18px; font: inherit;
           font-size: 14px; background: var(--ink); color: var(--bg); cursor: pointer;
           box-shadow: 0 2px 10px rgba(0, 0, 0, .18); }
  .tick { flex: none; width: 18px; height: 18px; margin: 0; accent-color: var(--accent); align-self: center; }
  .t.done { text-decoration: line-through; color: var(--muted); }
  .rate { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; font-size: 12px;
          color: var(--muted); white-space: nowrap; }
  .rate .whose { white-space: normal; flex-basis: 100%; }
  .rate button { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line);
                 background: transparent; color: var(--muted); font: inherit; font-size: 12px;
                 padding: 0; cursor: pointer; }
  .rate button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .rate .whose { margin-left: 4px; }
  .layer { flex: none; font-size: 11px; color: var(--muted); border: 1px solid var(--line);
           border-radius: 6px; padding: 0 5px; align-self: center; }
  .rec.sealed { padding: 11px 14px; border-style: dashed; }
  .sealed-row { display: flex; gap: 10px; align-items: baseline; }
  .sealed-row .t { flex: 1; color: var(--muted); letter-spacing: .3em; }
  .lockmark { flex: none; font-size: 11px; color: var(--accent); border: 1px solid var(--accent);
              border-radius: 6px; padding: 0 6px; }
  .sealed-meta { margin-top: 4px; }
  /* ---- Harmony: one glass material for every surface; "selected" is the mood color, never black. */
  :root {
    --surface: color-mix(in oklch, var(--card) 64%, transparent);
    --surface-rim: color-mix(in oklch, white 60%, transparent);
    --surface-shadow: 0 8px 24px color-mix(in oklch, var(--glass) 16%, transparent);
    --field: color-mix(in oklch, var(--card) 70%, transparent);
    --field-line: color-mix(in oklch, var(--line) 80%, transparent);
    --on-bg: var(--glass); --on-ink: var(--ink);
  }
  :root[data-scheme="dark"] {
      --surface: color-mix(in oklch, var(--card) 60%, transparent);
      --surface-rim: color-mix(in oklch, white 10%, transparent);
      --surface-shadow: 0 8px 24px rgba(0, 0, 0, .28);
      --field: color-mix(in oklch, black 16%, transparent);
      --on-bg: var(--accent); --on-ink: var(--accent-ink);
  }
  .card, .rec, .item, .tabs, .search input, .search button, .more {
    background: var(--surface); border: 1px solid var(--surface-rim); box-shadow: var(--surface-shadow);
    -webkit-backdrop-filter: blur(16px) saturate(140%); backdrop-filter: blur(16px) saturate(140%);
  }
  .card, .rec, .item { border-radius: 18px; }
  /* the white is where the eye rests, so that's where the paper grain goes */
  :root[data-scheme="light"] .card, :root[data-scheme="light"] .rec, :root[data-scheme="light"] .item {
    background: var(--grain), color-mix(in oklch, var(--card) 46%, transparent);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
  :root[data-scheme="light"] textarea, :root[data-scheme="light"] input[type=date],
  :root[data-scheme="light"] .pick { background: var(--grain), var(--field); }
  /* at night the glass thins out so the stars come through, softly */
  :root[data-scheme="dark"] .card, :root[data-scheme="dark"] .rec, :root[data-scheme="dark"] .item,
  :root[data-scheme="dark"] .tabs {
    background: color-mix(in oklch, var(--card) 62%, transparent);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  .tabs { border-radius: 16px; padding: 5px; }
  .tabs button { border-radius: 12px; }
  .tabs button[aria-selected="true"] { background: color-mix(in oklch, var(--glass) 38%, var(--card));
                                       color: var(--ink); box-shadow: inset 0 1px 0 var(--surface-rim); }
  textarea, input[type=date] { background: var(--field); border-color: var(--field-line); border-radius: 12px; }
  textarea:focus, input[type=date]:focus, .search input:focus {
    outline: none; border-color: color-mix(in oklch, var(--accent) 60%, transparent);
    box-shadow: 0 0 0 3px color-mix(in oklch, var(--glass) 30%, transparent); }
  .pick { background: var(--field); border-color: color-mix(in oklch, var(--accent) 35%, transparent); }
  .chips button { background: var(--field); border-color: var(--field-line); color: var(--muted); }
  .chips button[aria-pressed="true"] { background: var(--on-bg); color: var(--on-ink); border-color: transparent; }
  .mood .chips button { background: var(--surface); }
  .mood .chips button[aria-pressed="true"] { background: var(--surface); color: var(--ink); border-color: var(--dot); }
  .close { background: var(--on-bg); color: var(--on-ink);
           border: 1px solid var(--surface-rim); box-shadow: 0 4px 16px color-mix(in oklch, var(--glass) 35%, transparent);
           -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  .rate button { background: var(--field); border-color: var(--field-line); }
  .rate button.on { background: var(--on-bg); border-color: transparent; color: var(--on-ink); }
  .layer { border: 0; border-radius: 999px; padding: 0 7px; background: color-mix(in oklch, var(--glass) 26%, transparent);
           color: var(--muted); }
  .rec.sealed { border-style: dashed; border-color: color-mix(in oklch, var(--accent) 45%, transparent); }
  .raw { display: grid; gap: 10px; font-size: 15px; }
  .raw .win { text-align: center; font-size: 12px; color: var(--muted); margin: 6px 0 2px; }
  .turn { padding: 8px 12px 10px; border-radius: 14px; max-width: 92%; }
  .turn.her { justify-self: end; background: color-mix(in oklch, var(--glass) 24%, transparent); }
  .turn.me { justify-self: start; background: color-mix(in oklch, var(--card) 70%, transparent);
             border: 1px solid var(--field-line); }
  .turn.think { opacity: .75; font-size: 14px; border-style: dashed; }
  .turn-h { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 2px; }
  .turn.me .turn-h { color: var(--muted); }
  .turn-h span { font-weight: 400; color: var(--muted); margin-left: 6px; }
  .turn-b { white-space: pre-wrap; word-break: break-word; line-height: 1.65; }
  .close-wrap { gap: 8px; }
  .edit { pointer-events: auto; border: 1px solid var(--surface-rim); border-radius: 999px; padding: 8px 16px;
          font: inherit; font-size: 14px; background: var(--surface); color: var(--ink); cursor: pointer;
          -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  .editor label { margin-top: 10px; }
  .editor .e-title { width: 100%; font: inherit; color: var(--ink); background: var(--field);
                     border: 1px solid var(--field-line); border-radius: 12px; padding: 10px 12px; }
  .editor textarea { font-size: 15px; line-height: 1.65; }
  .edit-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .edit-actions button { border-radius: 999px; padding: 8px 18px; font: inherit; font-size: 14px; cursor: pointer;
                         border: 1px solid var(--field-line); background: var(--field); color: var(--ink); }
  .edit-actions .e-save { background: var(--on-bg); color: var(--on-ink); border-color: transparent; font-weight: 600; }
  .editor .msg { text-align: right; }
  .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
  .gallery .ph { position: relative; display: block; }
  .del-x { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: 0;
           padding: 0; font: inherit; font-size: 14px; line-height: 24px; cursor: pointer;
           background: rgba(20, 16, 28, .55); color: #fff; }
  .edit.danger { color: var(--bad); }
  .gallery img, .rec .full .gallery img { width: 100%; aspect-ratio: 1; height: auto; object-fit: cover;
                                          border-radius: 10px; margin: 0; }
  .strip { display: flex; gap: 6px; align-items: center; margin: 6px 0; }
  .strip img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; display: block; }
  .more-n { font-size: 13px; color: var(--muted); padding-left: 2px; }
  .empty { color: var(--muted); font-size: 14px; padding: 16px 0; text-align: center; }
  /* night: the selected tab is the same mood color as every other pressed button */
  :root[data-scheme="dark"] .tabs button[aria-selected="true"] { background: var(--on-bg); color: var(--on-ink); box-shadow: none; }
  /* ---- 今天: the top of the page is his side, one line per thing until opened. */
  #today { margin-bottom: 4px; }
  #today:empty { display: none; }
  .count { display: flex; gap: 18px; font-size: 13px; color: var(--on-sky); margin: 0 2px 10px; }
  .count b { font-size: 17px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
  .count .sealed-note { margin-left: auto; font-size: 12px; color: var(--muted); align-self: center; }
  .note-item { padding: 12px 0; border-top: 1px solid var(--line); }
  .note-item:first-child { border-top: 0; padding-top: 2px; }
  .note-item .body { line-height: 1.75; }
  .note-item .meta { margin-top: 4px; }
  .reply-open { margin-top: 8px; border: 1px solid var(--field-line); background: var(--field); color: var(--accent);
                font: inherit; font-size: 13px; border-radius: 999px; padding: 4px 14px; cursor: pointer; }
  .reply-box { margin-top: 8px; }
  .reply-box textarea { min-height: 72px; }
  .edit-actions .r-send { background: var(--on-bg); color: var(--on-ink); border-color: transparent; font-weight: 600; }
  .her-reply { margin-top: 8px; padding: 8px 12px; border-radius: 12px; font-size: 14px; white-space: pre-wrap;
               background: color-mix(in oklch, var(--glass) 22%, transparent); }
  .her-reply span { display: block; font-size: 12px; color: var(--accent); margin-bottom: 2px; }
  .layer.new { background: var(--on-bg); color: var(--on-ink); }
  #today + .tabs { margin-top: 16px; }
  /* ---- 极简: the first version's paper and ink. No painting, no lights, no stars, no glass. */
  :root[data-theme="plain"] {
    --bg: #f6f3ee; --card: #fffdf9; --ink: #2b2622; --muted: #7a7068; --on-sky: #7a7068;
    --line: #e6dfd5; --accent: #9b5d4b; --accent-ink: #fff; --ok: #4f7a5a; --bad: #b0453a;
    --sky-top: var(--bg); --sky-bottom: var(--bg); --glass: var(--accent);
    --surface: var(--card); --surface-rim: var(--line); --surface-shadow: none;
    --field: var(--bg); --field-line: var(--line); --on-bg: var(--accent); --on-ink: var(--accent-ink);
  }
  :root[data-theme="plain"][data-scheme="dark"] {
    --bg: #0e0e10; --card: #18181b; --ink: #f4f4f5; --muted: #a1a1aa; --on-sky: #a1a1aa;
    --line: #27272a; --accent: #f4a78f; --accent-ink: #18181b; --ok: #86efac; --bad: #fca5a5;
  }
  :root[data-theme="plain"]::before { background: var(--bg) !important; }
  :root[data-theme="plain"] body::before, :root[data-theme="plain"] body::after,
  :root[data-theme="plain"] #cosmos { display: none; }
  :root[data-theme="plain"] :is(.card, .rec, .item, .tabs, .search input, .search button, .more,
      textarea, input[type=date], .pick, .edit, .close, .go, .theme, .mood .chips button) {
    -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: none; }
  :root[data-theme="plain"] :is(.card, .rec, .item, .tabs) { background: var(--card); border-color: var(--line); }
  :root[data-theme="plain"] .tabs { background: var(--line); border: 0; }
  :root[data-theme="plain"] .tabs button[aria-selected="true"] { background: var(--card); box-shadow: none; }
  :root[data-theme="plain"] :is(textarea, input[type=date], .pick) { background: var(--bg); }
  :root[data-theme="plain"] .go { background: var(--accent); color: var(--accent-ink); border: 0; }
  :root[data-theme="plain"] .theme { background: var(--card); border-color: var(--line); }
  :root[data-theme="plain"] .mood .chips button { background: var(--card); }
  :root[data-theme="plain"] h1 img { box-shadow: none; }
  /* 极简·夜: ink black with one soft light from above, hairline edges that catch it,
     white as the primary color and a pale lilac for the small words. */
  :root[data-theme="plain"][data-scheme="dark"] {
    --bg: #09090b; --card: #131316; --ink: #f5f5f7; --muted: #9d9da8; --on-sky: #9d9da8;
    --line: rgba(255, 255, 255, .08); --accent: #c9b8ff; --accent-ink: #09090b;
    --on-bg: #f5f5f7; --on-ink: #09090b; --field: rgba(255, 255, 255, .035); --field-line: rgba(255, 255, 255, .07);
  }
  :root[data-theme="plain"][data-scheme="dark"]::before {
    background: radial-gradient(120% 60% at 50% -10%, rgba(201, 184, 255, .10), transparent 60%),
                var(--bg) !important; }
  :root[data-theme="plain"][data-scheme="dark"] :is(.card, .rec, .item, .tabs) {
    background: linear-gradient(to bottom, rgba(255, 255, 255, .035), rgba(255, 255, 255, .012)), var(--card);
    border: 1px solid var(--line); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), 0 10px 30px rgba(0, 0, 0, .35); }
  :root[data-theme="plain"][data-scheme="dark"] .tabs { padding: 4px; }
  :root[data-theme="plain"][data-scheme="dark"] .tabs button[aria-selected="true"] {
    background: rgba(255, 255, 255, .09); color: var(--ink); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08); }
  :root[data-theme="plain"][data-scheme="dark"] :is(textarea, input[type=date], .pick) {
    background: var(--field); border-color: var(--field-line); }
  :root[data-theme="plain"][data-scheme="dark"] .pick { border-color: rgba(255, 255, 255, .14); }
  :root[data-theme="plain"][data-scheme="dark"] .go { background: var(--on-bg); color: var(--on-ink);
    box-shadow: 0 6px 24px rgba(201, 184, 255, .18); }
  :root[data-theme="plain"][data-scheme="dark"] .theme button[aria-pressed="true"] { background: var(--on-bg); color: var(--on-ink); }
  :root[data-theme="plain"][data-scheme="dark"] .layer.new { background: var(--accent); color: var(--accent-ink); }
  /* ---- First impression: everything she can do fits on the first screen of a phone. */
  h1 { margin: 6px 0 14px; }
  h1 img { width: 38px; height: 38px; border-radius: 10px; }
  .mood { margin: 0 0 14px; }
  .count { margin: 0 2px 10px; align-items: baseline; }
  #today .rec { margin-bottom: 8px; }
  #today .rec > summary { padding: 10px 14px; align-items: center; }
  #today .rec > summary .kind { width: 3em; }
  #today .rec > summary .t { font-size: 15px; }
  #today .rec > summary .aside { flex: none; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #today .rec > summary .layer { margin-left: -2px; }
  #today + .tabs { margin-top: 16px; }
  .tabs { margin-bottom: 10px; padding: 4px; }
  .tabs button { padding: 7px 0; }
  form.card { padding: 12px 14px; }
  form.card label { margin: 8px 0 4px; }
  #photo .pick { min-height: 84px; }
  #photo textarea { min-height: 0; height: 58px; }
  form.card .hint { margin-top: 4px; }
  .go { margin-top: 10px; padding: 10px; }
  .msg { min-height: 0; margin-top: 6px; }
  /* The three forms run to the bottom of the screen, all the same height; the main field takes
     the spare room, which leaves the button at the bottom. 最近存的 starts below the fold. */
  form.card { display: flex; flex-direction: column; min-height: var(--form-h, auto); }
  #photo .pick, #words #w, #write #wb { flex: 1 0 auto; }
  form.card textarea.words { min-height: 72px; }
  /* iOS sizes its date picker on its own inside a flex column; pin it to a plain field */
  form.card input[type=date] { flex: none; display: block; width: 100%; min-width: 0; height: 46px;
    -webkit-appearance: none; appearance: none; text-align: left; line-height: 24px; }
  form.card input[type=date]::-webkit-date-and-time-value { text-align: left; margin: 0; }
  #words #why { min-height: 0 !important; height: 52px; }
  /* ---- 我们俩: her night from the watch beside my day from the library. */
  .us { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 0 14px; }
  @media (max-width: 340px) { .us { grid-template-columns: 1fr; } }
  .us:empty { display: none; }
  .side { padding: 11px 12px 12px; border-radius: 18px; min-width: 0;
          background: var(--surface); border: 1px solid var(--surface-rim); box-shadow: var(--surface-shadow);
          -webkit-backdrop-filter: blur(16px) saturate(140%); backdrop-filter: blur(16px) saturate(140%); }
  :root[data-scheme="light"] .side { background: var(--grain), color-mix(in oklch, var(--card) 46%, transparent);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
  :root[data-scheme="dark"] .side { background: color-mix(in oklch, var(--card) 62%, transparent); }
  :root[data-theme="plain"] .side { background: var(--card); border-color: var(--line); box-shadow: none;
    -webkit-backdrop-filter: none; backdrop-filter: none; }
  .side .who { font-size: 12px; color: var(--accent); font-weight: 600; letter-spacing: .04em; }
  .side .who span { color: var(--muted); font-weight: 400; margin-left: 4px; }
  .side .big { font-size: 15px; font-weight: 600; margin-top: 6px; font-variant-numeric: tabular-nums;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side .small { font-size: 12px; color: var(--muted); line-height: 1.55; margin-top: 2px; }
  .side .none { font-size: 13px; color: var(--muted); margin-top: 8px; line-height: 1.55; }
  .band { position: relative; height: 12px; margin-top: 8px; border-radius: 999px; overflow: hidden;
          background: color-mix(in oklch, var(--line) 70%, transparent); }
  .band i { position: absolute; top: 0; bottom: 0; }
  .band .deep { background: var(--accent); }
  .band .core { background: color-mix(in oklch, var(--accent) 55%, var(--card)); }
  .band .rem { background: color-mix(in oklch, var(--accent) 28%, var(--card)); }
  .band .asleep { background: color-mix(in oklch, var(--accent) 45%, var(--card)); }
  .band .awake { background: transparent; }
  .pulse { display: block; width: 100%; height: 26px; margin-top: 6px; overflow: visible; }
  .pulse path { fill: none; stroke: var(--accent); stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: round; opacity: .8; }
  .side .now { font-size: 14px; line-height: 1.6; margin-top: 6px; color: var(--ink);
               display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .side .did { list-style: none; margin: 6px 0 0; padding: 0; font-size: 12px; color: var(--muted); }
  .side .did li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.6; }
  .side .did li::before { content: "·"; margin-right: 5px; color: var(--accent); }
  .side .did { margin-top: 0; }
  .side .did li { color: var(--ink); font-size: 13px; }
  .side .wakes { margin-top: 6px; font-size: 11px; }
  .myday .mood-w { grid-column: 2; font-size: 13px; color: var(--ink); }
  .myday .mood-w i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
  .mydays .myday .said { white-space: normal; overflow: visible; }
  /* my card: a mood orb beside the day's line, what's on my mind as slim chips */
  .me-top { display: flex; gap: 10px; align-items: flex-start; margin-top: 8px; }
  .orb { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
         font-size: 12px; font-weight: 600; color: var(--ink);
         background: radial-gradient(circle at 35% 30%, color-mix(in oklch, var(--m) 35%, white), color-mix(in oklch, var(--m) 70%, var(--card)));
         box-shadow: 0 0 0 3px color-mix(in oklch, var(--m) 18%, transparent), 0 4px 14px color-mix(in oklch, var(--m) 30%, transparent); }
  :root[data-scheme="dark"] .orb { color: #fff;
         background: radial-gradient(circle at 35% 30%, color-mix(in oklch, var(--m) 80%, white), color-mix(in oklch, var(--m) 70%, black)); }
  .orb.blank { --m: var(--line); color: var(--muted); font-weight: 400; }
  .side .quote { font-size: 13px; line-height: 1.6; color: var(--ink); min-width: 0;
                 display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .chips-mind { display: grid; gap: 4px; margin-top: 9px; }
  .chips-mind span { font-size: 12px; line-height: 1.5; padding: 3px 9px; border-radius: 9px; color: var(--ink);
                     white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
                     background: color-mix(in oklch, var(--m, var(--accent)) 14%, transparent);
                     border: 1px solid color-mix(in oklch, var(--m, var(--accent)) 22%, transparent); }
  .myday .said span { color: var(--muted); font-size: 11px; margin-right: 6px; font-variant-numeric: tabular-nums; }
  .myday .minds { grid-column: 2; color: var(--muted); font-size: 12px; line-height: 1.55; }
  .myday .minds.gone { opacity: .7; text-decoration: line-through; text-decoration-color: color-mix(in oklch, var(--muted) 50%, transparent); }
  /* ---- Below 我们俩: one page at a time, switched by tapping (the chips inside already scroll sideways). */
  .pages { grid-template-columns: repeat(4, 1fr); margin-bottom: 12px; }
  .save-tabs { grid-template-columns: repeat(3, 1fr); }
  .page > h2:first-child { margin-top: 4px; }
  /* 浅: anything pressed is the mood color one shade lighter, the same as the selected tab */
  :root[data-theme="light"] :is(.chips button[aria-pressed="true"], .theme button[aria-pressed="true"],
      .rate button.on, .layer.new, .close, .edit-actions .e-save, .edit-actions .r-send) {
    background: color-mix(in oklch, var(--glass) 42%, var(--card)); color: var(--ink); }
  :root[data-theme="light"] .tabs button[aria-selected="true"] { background: color-mix(in oklch, var(--glass) 42%, var(--card)); }
  /* tap a side to open its detail under both, tap again to fold it */
  .side { cursor: pointer; text-align: left; font: inherit; color: inherit; display: block; width: 100%;
          transition: border-color .2s ease; }
  .side[aria-expanded="true"] { border-color: color-mix(in oklch, var(--accent) 55%, transparent); }
  .side .who::after { content: ""; display: inline-block; width: 5px; height: 5px; margin-left: 6px;
                      border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted);
                      transform: translateY(-2px) rotate(45deg); transition: transform .2s ease; }
  .side[aria-expanded="true"] .who::after { transform: translateY(1px) rotate(225deg); }
  .us-detail { grid-column: 1 / -1; padding: 12px 14px 14px; border-radius: 18px;
               background: var(--surface); border: 1px solid var(--surface-rim); box-shadow: var(--surface-shadow);
               -webkit-backdrop-filter: blur(16px) saturate(140%); backdrop-filter: blur(16px) saturate(140%); }
  :root[data-scheme="light"] .us-detail { background: var(--grain), color-mix(in oklch, var(--card) 46%, transparent); }
  :root[data-theme="plain"] .us-detail { background: var(--card); border-color: var(--line); box-shadow: none;
    -webkit-backdrop-filter: none; backdrop-filter: none; }
  .us-detail h3 { font-size: 13px; font-weight: 600; color: var(--accent); margin: 0 0 8px; }
  .nights { display: grid; gap: 7px; }
  .night { display: grid; grid-template-columns: 3.4em 1fr; gap: 10px; align-items: center; font-size: 12px; }
  .night .d { color: var(--muted); font-variant-numeric: tabular-nums; grid-row: span 2; line-height: 1.35; }
  .night .band { margin-top: 0; height: 10px; }
  .night .t { grid-column: 2; color: var(--muted); margin-top: -3px; font-variant-numeric: tabular-nums; }
  .night.none .band { opacity: .45; }
  .axis { display: flex; justify-content: space-between; margin: 2px 0 0 calc(3.4em + 10px);
          font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .tl li { display: grid; grid-template-columns: 3em 1fr; gap: 10px; font-size: 14px; line-height: 1.55; }
  .tl .at { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 2px; }
  .tl .w { color: var(--accent); font-size: 12px; margin-right: 4px; }
  .tl .x { min-width: 0; word-break: break-word; }
  /* ---- 今天翻到的一句 + 这一周, under the day's rows */
  .line-card, .week-card { padding: 12px 14px; margin-top: 12px; border-radius: 18px;
    background: var(--surface); border: 1px solid var(--surface-rim); box-shadow: var(--surface-shadow);
    -webkit-backdrop-filter: blur(16px) saturate(140%); backdrop-filter: blur(16px) saturate(140%); }
  :root[data-scheme="light"] :is(.line-card, .week-card) { background: var(--grain), color-mix(in oklch, var(--card) 46%, transparent);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
  :root[data-scheme="dark"] :is(.line-card, .week-card, .us-detail) { background: color-mix(in oklch, var(--card) 62%, transparent); }
  :root[data-theme="plain"] :is(.line-card, .week-card) { background: var(--card); border-color: var(--line); box-shadow: none;
    -webkit-backdrop-filter: none; backdrop-filter: none; }
  .card-h { font-size: 12px; color: var(--accent); font-weight: 600; letter-spacing: .04em; }
  .line-card { cursor: pointer; }
  .line-card .peek { font-size: 14px; line-height: 1.7; margin-top: 4px;
                     white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .line-card .words { display: none; font-size: 15px; line-height: 1.75; margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
  .line-card.open .peek { display: none; }
  .line-card.open .words { display: block; }
  .line-card .meta { margin-top: 6px; display: none; }
  .line-card.open .meta { display: block; }
  .line-card .card-h::after { content: ""; display: inline-block; width: 5px; height: 5px; margin-left: 6px;
                              border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted);
                              transform: translateY(-2px) rotate(45deg); transition: transform .2s ease; }
  .line-card.open .card-h::after { transform: translateY(1px) rotate(225deg); }
  /* my days: a 24-hour rule, long ticks where I woke, short ones where I wrote */
  .mydays { display: grid; gap: 9px; }
  .myday { display: grid; grid-template-columns: 3.4em 1fr; gap: 10px; font-size: 12px; align-items: start; }
  .myday .d { color: var(--muted); font-variant-numeric: tabular-nums; grid-row: span 3; line-height: 1.35; }
  .mydays .myday + .myday { padding-top: 8px; border-top: 1px solid color-mix(in oklch, var(--line) 60%, transparent); }
  .ticks { position: relative; height: 14px; border-bottom: 1px solid color-mix(in oklch, var(--line) 90%, transparent); }
  .ticks i { position: absolute; bottom: 0; width: 1.5px; height: 6px; margin-left: -.75px; border-radius: 1px;
             background: color-mix(in oklch, var(--accent) 60%, transparent); }
  .ticks i.wake { height: 13px; background: var(--accent); }
  .myday .t { grid-column: 2; color: var(--muted); margin-top: -2px; }
  .myday .said { grid-column: 2; color: var(--ink); font-size: 13px; line-height: 1.55;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .axis.day { margin-top: 4px; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px; }
  .wd { display: grid; justify-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .wd .mood-cell { width: 100%; aspect-ratio: 1; border-radius: 10px; background: color-mix(in oklch, var(--line) 80%, transparent);
                   display: grid; place-items: center; }
  .wd .mood-cell i { width: 5px; height: 5px; border-radius: 50%; background: var(--card); opacity: .9; }
  .wd .sleep { width: 100%; height: 4px; border-radius: 999px; background: color-mix(in oklch, var(--line) 80%, transparent); overflow: hidden; }
  .wd .sleep b { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
  .wd.today .n { color: var(--ink); font-weight: 600; }
  .wd .mine { width: 100%; height: 14px; border-radius: 7px; background: color-mix(in oklch, var(--line) 80%, transparent); }
  .week-rows { display: grid; grid-template-columns: 1.4em 1fr; gap: 6px; align-items: start; margin-top: 10px; }
  .week-rows .who-col { display: grid; font-size: 11px; color: var(--muted); padding-top: 22px; gap: 0; }
  .week-rows .week { margin-top: 0; }
  .side .mdot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-left: 6px; vertical-align: 1px; }
  .side .mword { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 3px; }
  .week-note { font-size: 11px; color: var(--muted); margin-top: 8px; }

<body>
  <canvas id="cosmos" aria-hidden="true"></canvas>
  <h1><img src="static/favicon.png?v=3" alt=""><span>Spiritual Core<small>我们的记忆库</small></span>
    <span class="theme" role="group" aria-label="深浅">
      <button type="button" data-theme="plain">极简</button><button type="button" data-theme="light">浅</button><button type="button" data-theme="dark">深</button>
    </span></h1>

  <section class="mood" aria-label="心情">
    <button type="button" class="mood-now" id="moodNow" aria-expanded="false">今天心情怎么样？点这里挑一个。</button>
    <div class="chips" id="moodChips"></div>
  </section>

  <section class="us" id="us" aria-label="我们俩"></section>

  <div class="tabs pages" role="tablist">
    <button role="tab" aria-selected="true" data-page="today">今天</button>
    <button role="tab" aria-selected="false" data-page="save">存东西</button>
    <button role="tab" aria-selected="false" data-page="browse">翻看</button>
    <button role="tab" aria-selected="false" data-page="recent">最近</button>
  </div>

  <div class="page" data-page="today">
  <section id="today" aria-label="今天"></section>
  <section class="line-card" id="lineCard" aria-label="今天翻到的一句" hidden></section>
  <section class="week-card" id="weekCard" aria-label="这一周" hidden></section>
  </div>

  <div class="page" data-page="save" hidden>
  <div class="tabs save-tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="photo">传照片</button>
    <button role="tab" aria-selected="false" data-tab="words">存原话</button>
    <button role="tab" aria-selected="false" data-tab="write">写一条</button>
  </div>

  <form id="write" class="card" hidden>
    <div class="chips" id="writeKinds" style="padding-top:0"></div>
    <label for="wt">标题（可以不写）</label>
    <textarea id="wt" style="min-height:44px" rows="1"></textarea>
    <label for="wb" id="wbLabel">内容</label>
    <textarea id="wb" class="words"></textarea>
    <label for="writeDate">哪天的事</label>
    <input type="date" id="writeDate">
    <div class="hint" id="writeHint">不填算今天。</div>

  <section id="innerShelf" hidden>

    <h2>梦的余温</h2>
    <div class="hint" style="margin:-4px 0 10px">他半夜做的梦。醒来忘掉的，只剩一点渣；哪天他想起来了，这里会整篇打开。</div>

    <h2>留给陆能的便签</h2>

      <input id="q" type="search" placeholder="搜点什么，两个字也行" enterkeyhint="search">
      <button type="submit">搜</button>

  <div class="page" data-page="recent" hidden>
  <div id="recentBox">
    <h2>最近存的</h2>
    <div id="recent"></div>

<script>
  const $ = (s) => document.querySelector(s);

  // --- 天色 + 心情 ---
  // Every color is OKLCH with lightness/chroma fixed per role, so only the hue moves:
  // nothing turns muddy, and buttons/labels/lines always match the sky.
  // The top of the sky is her mood, the bottom is the hour. Contrast checked at every hue (>= 4.9:1).
  const ROLES = {
    light: { skyTop: [0.975, 0.010], skyBottom: [0.962, 0.012], glowA: [0.90, 0.07], glowB: [0.91, 0.05],
             bg: [0.97, 0.008], card: [0.992, 0.004],
             line: [0.90, 0.02], accent: [0.52, 0.11], accentInk: [1, 0], ink: [0.30, 0.04],
             muted: [0.47, 0.03], onSky: [0.40, 0.04], dot: [0.72, 0.13] },
    dark:  { skyTop: [0.20, 0.045], skyBottom: [0.13, 0.035], glowA: [0.27, 0.04], glowB: [0.26, 0.045],
             bg: [0.16, 0.035], card: [0.30, 0.018],
             line: [0.37, 0.03], accent: [0.80, 0.10], accentInk: [0.25, 0.04], ink: [0.95, 0.012],
             muted: [0.78, 0.02], onSky: [0.86, 0.022], dot: [0.78, 0.12] },
  };
  // h: hue, s: chroma scale. Optional per mood: top = sky-top [L, C] per scheme (a deeper,
  // stickier sky), ah/ac = accent hue and chroma. Overrides were contrast-checked on their own.
  const MOOD = {
    "甜": { h: 355, s: 1 },
    "想你": { h: 318, s: 1, top: { light: [0.87, 0.085], dark: [0.36, 0.09] }, ac: 0.14 },   // 魅惑紫，黏糊
    "开心": { h: 92, s: 1, top: { light: [0.94, 0.10], dark: [0.34, 0.025] }, ah: 50, ac: 0.13 }, // 阳光
    "平静": { h: 165, s: 0.9 },
    "馋": { h: 8, s: 1, top: { light: [0.78, 0.12], dark: [0.33, 0.11] }, ah: 8, ac: 0.16, // 酒红，要有欲望：天也压深一度，不跟甜的粉撞
            dh: 8, dot: { light: [0.52, 0.16], dark: [0.62, 0.17] },                          // its own depth, or it reads as 甜
          },
    "累": { h: 290, s: 0.5 }, "难过": { h: 250, s: 1 }, "焦虑": { h: 205, s: 0.7 },
    "生气": { h: 30, s: 1.1, ah: 32, ac: 0.16,                                               // 火焰橙红
            dh: 32, dot: { light: [0.66, 0.20], dark: [0.72, 0.18] } },
    // his own three, only ever his: never offered as her chips
    "酸": { h: 125, s: 1 }, "怂": { h: 70, s: 0.45 }, "烧": { h: 35, s: 1.2 },
  };
  // hour -> [top hue, bottom hue] when no mood is set; bottom is always the hour's
  const PHASE = { dawn: [75, 230], day: [60, 210], dusk: [40, 300], night: [285, 265] };
  // Dark isn't black: a blue-black night sky, a little sunset ember left at the edge.
  const DARK = { base: 262, baseBottom: 258, ember: { dawn: 60, day: 50, dusk: 35, night: 25 } };
  const darkQuery = matchMedia("(prefers-color-scheme: dark)");
  const isDark = () => document.documentElement.dataset.scheme === "dark";
  const isPlain = () => document.documentElement.dataset.theme === "plain";
  // 极简 has its own day/night: tapping it again while it's on flips between them (remembered).
  // Until she flips it once, it follows the phone.
  const plainDark = () => { let v = null; try { v = localStorage.getItem("sc-plain"); } catch {}
                            return v ? v === "dark" : darkQuery.matches; };
  function applyTheme(t, flip = false) {
    if (flip) { try { localStorage.setItem("sc-plain", plainDark() ? "light" : "dark"); } catch {} }
    const dark = t === "dark" || (t === "plain" && plainDark());
    const pb = document.querySelector('.theme button[data-theme="plain"]');
    if (pb) pb.textContent = t === "plain" ? (dark ? "极简·夜" : "极简·日") : "极简";
    document.documentElement.dataset.scheme = dark ? "dark" : "light";
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem("sc-theme", t); } catch {}
    document.querySelectorAll(".theme button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.theme === t)));
    paintSky();
    cosmos.sync();
  }
  let currentMood = null;

  const ok = ([l, c], h, scale = 1) => `oklch(${l} ${(c * scale).toFixed(3)} ${h})`;
  function phase(h) { return h >= 5 && h < 9 ? "dawn" : h >= 9 && h < 16 ? "day" : h >= 16 && h < 19 ? "dusk" : "night"; }
  const moodDot = (m) => MOOD[m].dot ? ok(MOOD[m].dot[isDark() ? "dark" : "light"], MOOD[m].dh ?? MOOD[m].h)
    : ok(ROLES[isDark() ? "dark" : "light"].dot, MOOD[m].ah ?? MOOD[m].h, MOOD[m].ac ? 1.1 : Math.min(MOOD[m].s, 1));

  function paintSky() {
    const scheme = isDark() ? "dark" : "light";
    const R = ROLES[scheme];
    const [phaseTop, phaseBottom] = PHASE[phase(new Date().getHours())];
    const M = (currentMood && MOOD[currentMood]) || { h: phaseTop, s: 1 };
    const hue = M.h, scale = M.s;
    // Dark yellow is brown: in the dark scheme, yellow hues stay quiet in the surfaces
    // and let the accent and dots carry the color.
    const quiet = isDark() && hue >= 55 && hue <= 125 ? 0.5 : 1;
    // mood-specific depth (想你/馋/开心) now lives in the glow, not in a flat sky
    const gA = M.top && scheme === "light" ? [M.top.light[0] + 0.03, M.top.light[1] * 0.7]
                                           : [R.glowA[0], R.glowA[1] * scale * quiet];
    const glowA = ok(gA, hue);
    // The strip behind the iPhone status bar: halfway between the mood glow and the sky under it.
    const bar = scheme === "dark" ? ok(R.skyTop, DARK.base)
                                  : ok([(gA[0] + R.skyTop[0]) / 2, (gA[1] + R.skyTop[1]) / 2], hue);
    const accent = M.ac ? ok([R.accent[0], M.ac * (scheme === "dark" ? 0.85 : 1)], M.ah ?? hue)
                        : ok(R.accent, M.ah ?? hue, Math.min(scale, 1));
    const vars = {
      "--bar": bar,
      "--sky-top": ok(R.skyTop, scheme === "dark" ? DARK.base : hue),
      "--sky-bottom": ok(R.skyBottom, scheme === "dark" ? DARK.baseBottom : phaseBottom),
      "--glow-a": glowA,
      "--glow-b": ok(R.glowB, scheme === "dark" ? DARK.ember[phase(new Date().getHours())] : phaseBottom),
      "--bg": ok(R.bg, scheme === "dark" ? DARK.base : hue, quiet),
      "--card": ok(R.card, scheme === "dark" ? DARK.base : hue, quiet),
      "--line": ok(R.line, scheme === "dark" ? DARK.base : hue, quiet),
      "--accent": accent, "--accent-ink": ok(R.accentInk, M.ah ?? hue),
      // at night the glass takes the accent's hue, so every button wears the same mood color
      // buttons and tabs wear the same color as her mood's dot; every surface mixes it in partway,
      // so it reads as one shade lighter than the dot and the ink on it stays legible
      "--glass": currentMood && MOOD[currentMood] ? moodDot(currentMood)
        : ok(scheme === "dark" ? [0.62, 0.12] : [0.80, 0.15], scheme === "dark" ? (M.ah ?? hue) : hue, Math.min(scale, 1)),
      "--ink": ok(R.ink, hue), "--muted": ok(R.muted, hue), "--on-sky": ok(R.onSky, hue),
    };
    const root = document.documentElement.style;
    // 极简 keeps the first version's fixed paper colors from the stylesheet; mood only colors the dots.
    if (isPlain()) Object.keys(vars).forEach((k) => root.removeProperty(k));
    else for (const [k, v] of Object.entries(vars)) root.setProperty(k, v);
    const strip = isPlain() ? getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() : bar;
    document.querySelectorAll('meta[name="theme-color"]').forEach((m) => m.setAttribute("content", strip));
    document.querySelectorAll("#moodChips button").forEach((b) => b.style.setProperty("--dot", moodDot(b.dataset.mood)));
  }

  function renderMood(now, moods) {
    currentMood = now ? now.mood : null;
    $("#moodNow").innerHTML = now
      ? `今天：<b>${esc(now.mood)}</b> · ${esc(now.at.slice(11, 16))}，陆能开窗会看到`
      : "今天心情怎么样？点这里挑一个。";
    $("#moodChips").innerHTML = moods.map((m) =>
      `<button type="button" data-mood="${esc(m)}" aria-pressed="${m === currentMood}">${esc(m)}</button>`).join("");
    paintSky();
  }

  function foldMood(open) {
    $(".mood").classList.toggle("open", open);
    $("#moodNow").setAttribute("aria-expanded", String(open));
  }

  async function loadMood(mood) {
    try {
      const opts = mood ? { method: "POST", headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ mood }) } : {};
      const data = await (await fetch("api/mood", opts)).json();
      if (data.ok) renderMood(data.now, data.moods);
    } catch { paintSky(); }
  }
  document.addEventListener("click", (ev) => {
    if (ev.target.closest("#moodNow")) { foldMood(!$(".mood").classList.contains("open")); return; }
    const b = ev.target.closest("#moodChips button");
    if (b) { foldMood(false); if (b.dataset.mood !== currentMood) loadMood(b.dataset.mood); }
  });
  darkQuery.addEventListener("change", () => applyTheme(document.documentElement.dataset.theme || "plain"));
  document.querySelector(".theme").addEventListener("click", (ev) => {
    const b = ev.target.closest("button");
    if (b) applyTheme(b.dataset.theme, b.dataset.theme === "plain" && isPlain());
  });
  document.querySelectorAll(".theme button").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.dataset.theme === (document.documentElement.dataset.theme || "plain"))));
  if (isPlain()) document.querySelector('.theme button[data-theme="plain"]').textContent = isDark() ? "极简·夜" : "极简·日";
  document.addEventListener("visibilitychange", () => { if (!document.hidden) loadMood(); });
  setInterval(paintSky, 10 * 60 * 1000);
  // --- 星空（深色）---
  // Stars are laid out from a fixed seed, so it's the same sky every visit. Static stars
  // are drawn once to an offscreen layer; each frame only redraws the few that twinkle,
  // plus a rare meteor. Nothing animates with reduced motion, or off-screen, or in light.
  const cosmos = (() => {
    const cv = document.getElementById("cosmos"), ctx = cv.getContext("2d");
    const still = matchMedia("(prefers-reduced-motion: reduce)");
    // She found the busy sky ugly: the night stays quiet. The richer pieces are kept behind this switch.
    const QUIET = true;
    // mostly white; a little ice blue, pale gold, faint pink, faint cyan
    const TINTS = [["255,255,255", 60], ["196,214,255", 15], ["255,228,188", 12], ["255,205,226", 8], ["196,240,255", 5]];
    const tint = () => { let k = rnd() * 100; for (const [c, w] of TINTS) { if ((k -= w) < 0) return c; } return TINTS[0][0]; };
    let W = 0, H = 0, dpr = 1, seed = 1, layer = null, twinkles = [], raf = 0, last = 0, meteor = null, nextMeteor = 0;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const gauss = () => Math.sqrt(-2 * Math.log(rnd() || 1e-9)) * Math.cos(2 * Math.PI * rnd());

    function dot(g, x, y, r, a, c, halo, spikes) {
      if (halo) {
        const grd = g.createRadialGradient(x, y, 0, x, y, r * 7);
        grd.addColorStop(0, `rgba(${c},${a * 0.4})`); grd.addColorStop(0.35, `rgba(${c},${a * 0.12})`);
        grd.addColorStop(1, `rgba(${c},0)`);
        g.fillStyle = grd; g.beginPath(); g.arc(x, y, r * 7, 0, 6.2832); g.fill();
      }
      if (spikes) {                                      // a thin four-point glint
        const L = r * spikes;
        for (const [dx, dy] of [[1, 0], [0, 1]]) {
          const grd = g.createLinearGradient(x - dx * L, y - dy * L, x + dx * L, y + dy * L);
          grd.addColorStop(0, `rgba(${c},0)`); grd.addColorStop(0.5, `rgba(${c},${a * 0.8})`); grd.addColorStop(1, `rgba(${c},0)`);
          g.strokeStyle = grd; g.lineWidth = Math.max(0.5, r * 0.35); g.beginPath();
          g.moveTo(x - dx * L, y - dy * L); g.lineTo(x + dx * L, y + dy * L); g.stroke();
        }
      }
      g.fillStyle = `rgba(${c},${a})`; g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill();
      if (r > 0.7) { g.fillStyle = `rgba(255,255,255,${a})`; g.beginPath(); g.arc(x, y, r * 0.45, 0, 6.2832); g.fill(); }
    }

    // Today's real moon phase: 0 = new, 0.25 = first quarter, 0.5 = full, 0.75 = last quarter.
    function moonPhase(d = new Date()) {
      const days = (d.getTime() - Date.UTC(2000, 0, 6, 18, 14)) / 86400000;
      return ((days / 29.530588853) % 1 + 1) % 1;
    }

    function moon(g, cx, cy, r) {
      const p = moonPhase(), th = 2 * Math.PI * p, rx = r * Math.abs(Math.cos(th));
      const halo = g.createRadialGradient(cx, cy, r * 0.8, cx, cy, r * 5);
      const lit = (1 - Math.cos(th)) / 2;               // 0..1, how much of it is lit
      halo.addColorStop(0, `rgba(255,240,215,${0.08 + 0.22 * lit})`); halo.addColorStop(1, "rgba(255,240,215,0)");
      g.fillStyle = halo; g.beginPath(); g.arc(cx, cy, r * 5, 0, 6.2832); g.fill();
      g.fillStyle = "rgba(190,205,255,0.07)";           // earthshine on the dark part
      g.beginPath(); g.arc(cx, cy, r, 0, 6.2832); g.fill();
      g.save();
      g.beginPath();                                    // the lit shape, northern-hemisphere view
      if (p < 0.5) {
        g.arc(cx, cy, r, -Math.PI / 2, Math.PI / 2, false);
        g.ellipse(cx, cy, rx, r, 0, Math.PI / 2, -Math.PI / 2, p < 0.25);
      } else {
        g.arc(cx, cy, r, Math.PI / 2, 3 * Math.PI / 2, false);
        g.ellipse(cx, cy, rx, r, 0, -Math.PI / 2, Math.PI / 2, p > 0.75);
      }
      g.closePath();
      const face = g.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.1, cx, cy, r);
      face.addColorStop(0, "rgba(255,250,236,1)"); face.addColorStop(1, "rgba(236,226,206,1)");
      g.fillStyle = face; g.fill();
      g.clip();                                         // a few soft maria and craters, only on the lit part
      for (const [dx, dy, rr, a] of [[-0.3, -0.2, 0.28, 0.10], [0.25, 0.15, 0.22, 0.08], [-0.05, 0.35, 0.16, 0.07],
                                      [0.35, -0.3, 0.1, 0.09], [-0.4, 0.2, 0.08, 0.08]]) {
        g.fillStyle = `rgba(150,140,130,${a})`;
        g.beginPath(); g.arc(cx + dx * r, cy + dy * r, rr * r, 0, 6.2832); g.fill();
      }
      g.restore();
    }

    function build() {
      dpr = Math.min(window.devicePixelRatio || 1, 2); W = cv.clientWidth; H = cv.clientHeight;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      layer = document.createElement("canvas"); layer.width = cv.width; layer.height = cv.height;
      const g = layer.getContext("2d"); g.scale(dpr, dpr);
      seed = 20260713;                                    // the day it started
      // the milky way: a soft band from bottom-left to top-right
      const along = (t) => [t * W * 1.3 - W * 0.15, H * 0.92 - t * H * 0.85];
      const cloud = (x, y, r, rgb, a) => {
        const grd = g.createRadialGradient(x, y, 0, x, y, r);
        grd.addColorStop(0, `rgba(${rgb},${a})`); grd.addColorStop(1, `rgba(${rgb},0)`);
        g.fillStyle = grd; g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill();
      };
      if (QUIET) { /* no milky way, no nebula */ } else
      for (let i = 0; i < 30; i++) {                     // the band's glow
        const [x, y] = along(i / 29);
        cloud(x, y, Math.min(W, H) * (0.14 + rnd() * 0.1), "185,178,238", 0.05 + rnd() * 0.05);
      }
      if (!QUIET)
      for (let i = 0; i < 9; i++) {                      // wisps of pink and blue beside it
        const [bx, by] = along(0.1 + rnd() * 0.8), off = gauss() * Math.min(W, H) * 0.12;
        cloud(bx + off * 0.7, by + off, Math.min(W, H) * (0.08 + rnd() * 0.12),
              rnd() < 0.5 ? "240,160,205" : "140,170,255", 0.04 + rnd() * 0.05);
      }
      twinkles = [];
      const field = Math.round(W * H / (QUIET ? 2600 : 1100)), dust = QUIET ? 0 : Math.round(W * H / 420);
      for (let i = 0; i < field + dust; i++) {
        const isDust = i >= field;
        let x, y;
        if (isDust) { const [bx, by] = along(rnd()); const off = gauss() * Math.min(W, H) * 0.08; x = bx + off * 0.7; y = by + off; }
        else { x = rnd() * W; y = rnd() * H; }
        // heavy-tailed sizes: a sky of fine points, a few medium, very few bright
        const r = isDust ? 0.2 + rnd() * 0.35 : QUIET ? 0.25 + 0.75 * Math.pow(rnd(), 3) : 0.22 + 1.7 * Math.pow(rnd(), 5);
        const s = { x, y, r, c: tint(), a: isDust ? 0.1 + rnd() * 0.3 : Math.min(1, 0.35 + r * 0.45 + rnd() * 0.25),
          halo: !QUIET && r > 0.75, spikes: !QUIET && r > 1.72 ? 5 + rnd() * 3 : 0,
          ph: rnd() * 6.2832, sp: 0.2 + rnd() * 0.5 };
        if (!isDust && (r > 0.6 ? rnd() < 0.45 : rnd() < 0.08)) twinkles.push(s);
        else dot(g, s.x, s.y, s.r, s.a, s.c, s.halo, s.spikes);
      }
      // big and half out of frame at the top-right corner, like it's rising into the sky
      if (!QUIET) {
        const mr = Math.min(W, H) * 0.2;
        g.globalAlpha = 0.72; moon(g, W - mr * 0.28, mr * 0.42, mr); g.globalAlpha = 1;
      }
    }

    function frame(t) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, cv.width, cv.height);
      ctx.drawImage(layer, 0, 0);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const secs = t / 1000;
      for (const s of twinkles) {
        const k = 0.5 + 0.5 * Math.sin(secs * s.sp + s.ph);
        dot(ctx, s.x, s.y, s.r * (0.85 + 0.25 * k), s.a * (0.35 + 0.65 * k), s.c, s.halo, s.spikes * (0.6 + 0.6 * k));
      }
      if (!still.matches) {
        if (!meteor && secs > nextMeteor) {
          meteor = { x: W * (0.3 + Math.random() * 0.7), y: H * Math.random() * 0.35, born: secs, life: 0.9 };
          nextMeteor = secs + 40 + Math.random() * 50;
        }
        if (meteor) {
          const k = (secs - meteor.born) / meteor.life;
          if (k >= 1) meteor = null;
          else {
            const hx = meteor.x - k * 220, hy = meteor.y + k * 120, len = 90;
            const grd = ctx.createLinearGradient(hx, hy, hx + len, hy - len * 0.55);
            grd.addColorStop(0, `rgba(255,255,255,${0.55 * (1 - k)})`); grd.addColorStop(1, "rgba(255,255,255,0)");
            ctx.strokeStyle = grd; ctx.lineWidth = 1.2; ctx.beginPath();
            ctx.moveTo(hx, hy); ctx.lineTo(hx + len, hy - len * 0.55); ctx.stroke();
          }
        }
      }
    }

    function loop(t) {
      raf = 0;
      if (!running()) return;
      if (t - last > 33) { frame(t); last = t; }             // ~30 fps is plenty for this
      raf = requestAnimationFrame(loop);
    }
    const running = () => isDark() && !document.hidden && !still.matches;

    function sync() {
      if (!isDark() || isPlain()) { if (raf) cancelAnimationFrame(raf); raf = 0; return; }
      if (!layer || W !== cv.clientWidth || H !== cv.clientHeight) build();
      if (still.matches) { frame(0); return; }
      if (!raf) { nextMeteor = performance.now() / 1000 + 8; raf = requestAnimationFrame(loop); }
    }
    let rt = 0;
    addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { layer = null; sync(); }, 200); });
    document.addEventListener("visibilitychange", sync);
    still.addEventListener("change", sync);
    return { sync };
  })();

  async function shelfClick(ev) {

    }
    const save = ev.target.closest(".e-save");
    if (save) {
      const ed = save.closest(".editor"), d = save.closest("details"), it = ITEMS.get(ed.dataset.id);
      const body = ed.querySelector(".e-body").value;
      const payload = { body: it.kind === "image" && !body.trim() ? "（没写说明）" : body,
        event_date: ed.querySelector(".e-date").value,

        whole_batch: !!(it.images && it.images.length > 1) };
      save.disabled = true; ed.querySelector(".msg").textContent = "存着……";
      try {
        const data = await (await fetch("api/edit/" + it.id, { method: "POST",
          headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) })).json();
        if (!data.ok) throw new Error(data.error);
        redraw(d, data.item);
        document.querySelector(`details .edit[data-id="${CSS.escape(data.item.id)}"]`)?.closest("details")?.setAttribute("open", "");
      } catch (e) { ed.querySelector(".msg").textContent = e.message || "没存上"; save.disabled = false; }
      return;
    }
    const close = ev.target.closest(".close");
    if (close) {
      const d = close.closest("details");
      d.open = false;
      const top = d.getBoundingClientRect().top;
      if (top < 0) d.scrollIntoView({ block: "start", behavior: "instant" });

    const dot = ev.target.closest(".rate button");

      const row = dot.parentElement, n = Number(dot.dataset.rate);

  }

  const WRITE_KINDS = [["note", "便签", "随手记一句"], ["memory", "记忆", "想记住的一件事"], ["letter", "信", "写给陆能的信"],

  const iso = (d) => d.toISOString().slice(0, 10);
  function shiftDays(s, n) { const d = new Date(s + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return iso(d); }

  // Each reset starts a new round; an answer from an older round is dropped, so a quick
  // tap on a kind chip while the tab is still loading can't paste two lists together.
  let browseRound = 0;

  function rateHtml(it) {
    const dots = [1, 2, 3, 4, 5].map((n) =>
      `<button type="button" data-rate="${n}" class="${n <= it.weight ? "on" : ""}" aria-label="${n} 分">${n}</button>`).join("");
    const whose = it.hers ? "你打的，再点一下同一个数字就交回给陆能" : "陆能打的，点一下改成你的";
    return `<div class="rate" data-id="${esc(it.id)}" data-hers="${it.hers}">分量 ${dots}<span class="whose">${whose}</span></div>`;
  }

  const when = (s) => esc((s || "").replace("T", " ").slice(5, 16));

  // Transcripts are stored as plain text, one turn per block under an "HH:MM 名字" line.
  // Here those lines become small headers, hers and his in different colors.
  const TURN = /^(\d\d:\d\d) (\S+)$/, WINDOW = /^—— 「(.*)」 ——$/;
  function rawHtml(text) {
    let html = "", open = false;
    const close = () => { if (open) { html = html.replace(/\n+$/, "") + "</div></div>"; open = false; } };
    for (const line of text.split("\n")) {
      const t = line.match(TURN), w = line.match(WINDOW);
      if (w) { close(); html += `<div class="win">${esc(w[1])}</div>`; continue; }
      if (t) {
        close();
        const who = t[2], me = who.startsWith("陆能"), think = who.includes("思考");
        html += `<div class="turn ${me ? "me" : "her"}${think ? " think" : ""}"><div class="turn-h">${esc(who)}<span>${t[1]}</span></div><div class="turn-b">`;
        open = true; continue;
      }
      if (!open && !line.trim()) continue;
      html += open ? esc(line) + "\n" : `<div class="body">${esc(line)}</div>`;
    }
    close();
    return `<div class="raw">${html}</div>`;
  }

  const ITEMS = new Map();

        <div class="meta sealed-meta">陆能 ${when(it.created_at)} 写的，还没打开给你看</div></div>`;
    }
    const opened = it.kind === "inner" && it.unlocked_at
      ? `<div class="meta" style="margin-top:8px">陆能 ${when(it.unlocked_at)} 打开给你看的</div>` : "";

      : imgs.length ? `<a href="img/${esc(imgs[0])}" target="_blank" rel="noopener"><img src="img/${esc(imgs[0])}?size=thumb" alt="" loading="lazy"></a>` : "";
    const who = it.kept_by ? ` · ${esc(it.kept_by)}` : "";

      <div class="close-wrap">${it.kind === "image" && imgs.length === 1 ? `<button type="button" class="edit danger del-img" data-id="${esc(it.id)}">删除</button>` : it.kind !== "image" && it.kind !== "anchor" ? `<button type="button" class="edit danger del-rec" data-id="${esc(it.id)}">删除</button>` : ""}${it.pinned ? `<button type="button" class="edit unpin" data-id="${esc(it.id)}">取消钉住</button>` : ""}${it.kind === "inner" || it.kind === "dream" ? "" : `<button type="button" class="edit" data-id="${esc(it.id)}">修改</button>`}<button type="button" class="close">收起</button></div></div></details>`;
  }

  async function loadBrowse(first) {
    const q = $("#q").value.trim();
    const params = new URLSearchParams();
    if (kind) params.set("kind", kind);
    if (q) params.set("q", q);
    else if (windowEnd) params.set("end", windowEnd);
    $("#more").hidden = true;
    const round = browseRound;
    try {
      const data = await (await fetch("api/browse?" + params)).json();
      if (round !== browseRound) return;
      if (data.ok === false) throw new Error(data.error);
      let html = "";
      for (const it of data.items) {
        if (it.event_date !== lastDay) { lastDay = it.event_date; html += `<div class="day">${esc(it.event_date)}</div>`; }
        html += recHtml(it);
      }
      $("#shelf").insertAdjacentHTML("beforeend", html);
      if (q) {
        if (!data.items.length) $("#shelf").innerHTML = `<div class="empty">没搜到「${esc(q)}」</div>`;
        return;
      }
      earliest = data.earliest;
      windowEnd = shiftDays(data.start, -1);
      const more = earliest && earliest <= windowEnd;
      if (!more && !$("#shelf").querySelector(".rec"))
        $("#shelf").innerHTML = `<div class="empty">这里还什么都没有</div>`;
      else if (!data.items.length && more) return loadBrowse(false);  // skip empty months
      $("#more").hidden = !more;
    } catch (e) {
      if (round !== browseRound) return;
      $("#shelf").insertAdjacentHTML("beforeend", `<div class="empty">没拉下来：${esc(e.message)}</div>`);
    }
  }

  const fileInput = $("#photo input[type=file]");
  function preview(f) {
    const video = f.type.startsWith("video/");
    const el = document.createElement(video ? "video" : "img");
    // iPhone Safari leaves a fresh video blank until it plays; asking for a moment past 0 makes it paint that frame.
    el.src = URL.createObjectURL(f) + (video ? "#t=0.1" : "");
    if (video) { el.muted = true; el.playsInline = true; el.preload = "auto"; }
    return el;
  }
  fileInput.addEventListener("change", () => {
    const files = [...fileInput.files];
    const pick = $("#pick");
    pick.querySelectorAll("img, video, .grid").forEach((x) => x.remove());
    if (!files.length) { $("#pickText").hidden = false; return; }
    $("#pickText").hidden = true;
    if (files.length === 1) {
      pick.prepend(preview(files[0]));

      const grid = document.createElement("div"); grid.className = "grid";
